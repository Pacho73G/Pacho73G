<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Código, estrategia y constancia</title>
  <desc id="desc">Dos robots futbolistas pasan un balón de código y marcan un gol de producto.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111C"/>
      <stop offset="0.55" stop-color="#0B1B2B"/>
      <stop offset="1" stop-color="#160D26"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="pitch" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#22D3EE" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="330" rx="24" fill="url(#bg2)"/>
  <rect width="1200" height="330" rx="24" fill="url(#pitch)"/>
  <rect x="1.5" y="1.5" width="1197" height="327" rx="22.5" fill="none" stroke="url(#line)" stroke-width="3" stroke-opacity="0.8"/>

  <text x="600" y="44" text-anchor="middle" fill="#F8FAFC" font-family="JetBrains Mono, Segoe UI, sans-serif" font-size="25" font-weight="800" letter-spacing="2">⚽ DEL CÓDIGO AL PRODUCTO</text>
  <text x="600" y="73" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="15">Analizar · Diseñar · Construir · Probar · Entregar</text>

  <!-- field -->
  <rect x="40" y="92" width="1120" height="190" rx="18" fill="#07141A" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="2"/>
  <line x1="600" y1="92" x2="600" y2="282" stroke="#22D3EE" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="600" cy="187" r="35" fill="none" stroke="#22D3EE" stroke-opacity="0.22" stroke-width="2"/>
  <rect x="1032" y="127" width="96" height="120" fill="none" stroke="#EC4899" stroke-width="4"/>
  <path d="M1032 127L1070 105H1160V247H1128" fill="none" stroke="#EC4899" stroke-opacity="0.55" stroke-width="3"/>
  <path d="M1050 132V242M1070 120V246M1090 110V246M1110 108V246M1130 108V246M1150 108V246" stroke="#EC4899" stroke-opacity="0.12"/>

  <!-- robot 1 -->
  <g transform="translate(102 143)" filter="url(#glow2)">
    <g>
      <rect x="0" y="22" width="60" height="46" rx="13" fill="#121A29" stroke="#22D3EE" stroke-width="3"/>
      <rect x="10" y="0" width="40" height="34" rx="12" fill="#182234" stroke="#22D3EE" stroke-width="3"/>
      <circle cx="23" cy="16" r="4" fill="#22D3EE"/><circle cx="38" cy="16" r="4" fill="#22D3EE"/>
      <path d="M14 69L5 100M46 69L58 99" stroke="#A78BFA" stroke-width="8" stroke-linecap="round"/>
      <path d="M0 38L-20 61M60 38L78 56" stroke="#A78BFA" stroke-width="7" stroke-linecap="round"/>
      <text x="30" y="51" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="10" font-weight="700">DEV</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;10 -4;0 0" dur="1.1s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- robot 2 -->
  <g transform="translate(592 138)" filter="url(#glow2)">
    <rect x="0" y="26" width="64" height="48" rx="13" fill="#171529" stroke="#A78BFA" stroke-width="3"/>
    <rect x="11" y="0" width="42" height="36" rx="12" fill="#201A38" stroke="#A78BFA" stroke-width="3"/>
    <circle cx="25" cy="17" r="4" fill="#EC4899"/><circle cx="40" cy="17" r="4" fill="#EC4899"/>
    <path d="M15 75L2 105M50 75L64 103" stroke="#22D3EE" stroke-width="8" stroke-linecap="round"/>
    <path d="M3 43L-22 60M61 43L84 52" stroke="#22D3EE" stroke-width="7" stroke-linecap="round"/>
    <text x="32" y="57" text-anchor="middle" fill="#EC4899" font-family="monospace" font-size="9" font-weight="700">BUILD</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;8 -3;0 0" dur="1.25s" repeatCount="indefinite"/>
  </g>

  <!-- goalkeeper -->
  <g transform="translate(1058 155)" opacity="0.9">
    <rect x="0" y="22" width="46" height="40" rx="11" fill="#231128" stroke="#EC4899" stroke-width="3"/>
    <rect x="8" y="0" width="30" height="30" rx="10" fill="#2B1533" stroke="#EC4899" stroke-width="3"/>
    <circle cx="18" cy="14" r="3" fill="#F8FAFC"/><circle cx="29" cy="14" r="3" fill="#F8FAFC"/>
    <path d="M10 63L2 88M36 63L45 88" stroke="#EC4899" stroke-width="7" stroke-linecap="round"/>
    <path d="M2 38L-16 18M44 38L62 18" stroke="#EC4899" stroke-width="6" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" values="1058 155;1050 135;1058 155" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- ball path -->
  <path id="ballPath" d="M195 236 C330 150, 465 242, 628 222 S875 130, 1090 170" fill="none" stroke="url(#line)" stroke-width="3" stroke-dasharray="8 10" opacity="0.36"/>
  <g filter="url(#glow2)">
    <circle r="15" fill="#F8FAFC" stroke="#22D3EE" stroke-width="3"/>
    <path d="M-4 -11L5 -8L8 1L1 9L-8 5L-10 -4Z" fill="#0D1117" opacity="0.9"/>
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#ballPath"/>
    </animateMotion>
    <animateTransform attributeName="transform" type="rotate" values="0;1080" dur="6s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- labels -->
  <g font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">
    <g transform="translate(250 113)"><rect width="88" height="28" rx="14" fill="#0D1117" stroke="#22D3EE"/><text x="44" y="19" text-anchor="middle" fill="#22D3EE">IDEA</text></g>
    <g transform="translate(500 245)"><rect width="98" height="28" rx="14" fill="#0D1117" stroke="#A78BFA"/><text x="49" y="19" text-anchor="middle" fill="#A78BFA">COMMIT</text></g>
    <g transform="translate(775 108)"><rect width="92" height="28" rx="14" fill="#0D1117" stroke="#EC4899"/><text x="46" y="19" text-anchor="middle" fill="#EC4899">DEPLOY</text></g>
  </g>

  <!-- goal flash -->
  <circle cx="1092" cy="170" r="22" fill="none" stroke="#F8FAFC" stroke-width="4" opacity="0">
    <animate attributeName="r" values="18;66" begin="5.1s" dur="0.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" begin="5.1s" dur="0.7s" repeatCount="indefinite"/>
  </circle>
  <text x="1080" y="116" text-anchor="middle" fill="#EC4899" font-family="JetBrains Mono, monospace" font-size="18" font-weight="900" opacity="0">¡GOL: PRODUCTO!
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.82;0.88;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <text x="600" y="312" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="15">Pensamiento analítico + ejecución técnica + trabajo en equipo</text>
</svg>
